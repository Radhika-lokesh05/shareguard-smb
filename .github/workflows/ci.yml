name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-lint:
    name: Lint, Typecheck, Test & Audit (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy server/shareguard

      - name: Run fast test suite with coverage
        run: |
          python -m pytest server/tests/ -m "not slow" --cov=server/shareguard --cov-report=term-missing --cov-report=xml

      - name: Security audit with pip-audit
        run: |
          set +e
          output=$(python -m pip_audit 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            if echo "$output" | grep -Ei "network error|connection error|timed out|unable to connect|failed to establish" > /dev/null; then
              echo "::warning ::pip-audit encountered a network/index reachability issue; continuing."
            else
              echo "::error ::pip-audit found security vulnerabilities in dependencies."
              exit $exit_code
            fi
          fi
